<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 好梦 · 哄睡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #1a1f3a 0%, #0a0d1a 60%);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        /* ========== 画布层 ========== */
        #stars-canvas,
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        #particle-canvas {
            z-index: 1;
            pointer-events: none;
        }

        /* ========== 月亮 ========== */
        .moon {
            position: fixed;
            top: 8vh;
            right: 15vw;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffbe6 0%, #ffe9c4 40%, #f5d49a 100%);
            box-shadow:
                0 0 30px rgba(255, 233, 196, 0.5),
                0 0 80px rgba(255, 233, 196, 0.25),
                0 0 140px rgba(255, 200, 150, 0.15);
            z-index: 2;
            cursor: pointer;
            animation: moonFloat 6s ease-in-out infinite;
            transition: box-shadow 0.6s ease, transform 0.15s ease;
        }
        .moon:hover {
            box-shadow:
                0 0 50px rgba(255, 233, 196, 0.7),
                0 0 110px rgba(255, 233, 196, 0.35),
                0 0 180px rgba(255, 200, 150, 0.25);
        }
        .moon:active {
            transform: scale(0.92);
        }

        @keyframes moonFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        /* 月亮涟漪 */
        .moon-ripple {
            position: fixed;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 233, 196, 0.55);
            pointer-events: none;
            z-index: 1;
            animation: moonRippleOut 2s ease-out forwards;
        }
        @keyframes moonRippleOut {
            0% {
                width: 80px;
                height: 80px;
                opacity: 0.85;
                transform: translate(0, 0);
            }
            100% {
                width: 320px;
                height: 320px;
                opacity: 0;
                transform: translate(-120px, -120px);
            }
        }

        /* ========== 孔明灯 ========== */
        .lantern {
            position: fixed;
            pointer-events: none;
            z-index: 3;
            left: var(--lx);
            bottom: -80px;
            animation: lanternRise var(--rise-dur) ease-out forwards;
        }
        .lantern-body {
            width: 28px;
            height: 38px;
            background: radial-gradient(ellipse at 50% 30%, #ffaa80 0%, #e8603a 70%, #b8352a 100%);
            border-radius: 50% 50% 45% 45%;
            margin: 0 auto;
            box-shadow: 0 0 18px 6px rgba(255, 150, 100, 0.55), 0 0 40px 12px rgba(255, 120, 70, 0.22);
            animation: lanternGlow 1.5s ease-in-out infinite alternate;
        }
        .lantern-wick {
            width: 2px;
            height: 6px;
            background: #ccc;
            margin: 0 auto;
        }
        .lantern-tail {
            width: 14px;
            height: 10px;
            background: rgba(200, 170, 140, 0.5);
            margin: 0 auto;
            border-radius: 0 0 50% 50%;
            border: 1px solid rgba(180, 140, 100, 0.35);
            border-top: none;
        }
        @keyframes lanternRise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.95;
            }
            70% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(calc(-100vh - 260px)) translateX(var(--drift)) rotate(var(--rot));
                opacity: 0;
            }
        }
        @keyframes lanternGlow {
            0% {
                box-shadow: 0 0 12px 4px rgba(255, 150, 100, 0.4), 0 0 28px 8px rgba(255, 120, 70, 0.14);
            }
            100% {
                box-shadow: 0 0 24px 8px rgba(255, 150, 100, 0.7), 0 0 52px 16px rgba(255, 120, 70, 0.32);
            }
        }

        /* ========== 主容器 ========== */
        .main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* ========== 呼吸圆圈 ========== */
        .breath-ring-outer {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .breath-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            animation: breatheRing var(--breath-dur, 8s) ease-in-out infinite;
        }
        @keyframes breatheRing {
            0% {
                width: 60px;
                height: 60px;
                opacity: 0.7;
                border-color: rgba(255, 184, 160, 0.5);
            }
            50% {
                width: 200px;
                height: 200px;
                opacity: 0;
                border-color: rgba(91, 127, 191, 0.1);
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0.7;
                border-color: rgba(255, 184, 160, 0.5);
            }
        }

        .breath-core {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe9c4 0%, rgba(255, 184, 160, 0.6) 50%, transparent 100%);
            box-shadow: 0 0 30px rgba(255, 184, 160, 0.6), 0 0 80px rgba(255, 184, 160, 0.3);
            animation: breatheCore var(--breath-dur, 8s) ease-in-out infinite;
            z-index: 2;
            transition: box-shadow 0.4s ease;
        }
        .breath-ring-outer:hover .breath-core {
            box-shadow: 0 0 50px rgba(255, 200, 170, 0.9), 0 0 120px rgba(255, 184, 160, 0.5), 0 0 180px rgba(255, 160, 130, 0.25);
        }
        @keyframes breatheCore {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(255, 184, 160, 0.5), 0 0 60px rgba(255, 184, 160, 0.25);
            }
            50% {
                transform: scale(2.2);
                box-shadow: 0 0 60px rgba(255, 184, 160, 0.8), 0 0 120px rgba(255, 184, 160, 0.4);
            }
        }

        /* ========== 速度提示 toast ========== */
        .speed-toast {
            position: fixed;
            left: 50%;
            bottom: 18vh;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            color: #e8dcc8;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .speed-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* ========== 文字 ========== */
        .text-group {
            text-align: center;
            color: #cdd6e8;
        }
        .text-title {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #e8dcc8;
            margin-bottom: 10px;
            animation: fadeText var(--breath-dur, 8s) ease-in-out infinite;
        }
        .text-hint {
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #8899b4;
            animation: fadeText var(--breath-dur, 8s) ease-in-out infinite;
            animation-delay: calc(var(--breath-dur, 8s) / 2);
        }
        @keyframes fadeText {
            0%,
            100% {
                opacity: 0.45;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 流萤 ========== */
        .fireflies {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffe6a0;
            box-shadow: 0 0 6px 2px rgba(255, 220, 140, 0.6);
            animation: fireflyFloat var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            left: var(--x);
            top: var(--y);
        }
        @keyframes fireflyFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.3);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
                transform: scale(1);
            }
            30% {
                transform: translate(var(--dx1), var(--dy1)) scale(1);
                opacity: 0.8;
            }
            60% {
                transform: translate(var(--dx2), var(--dy2)) scale(0.6);
                opacity: 0.4;
            }
            90% {
                opacity: 0;
                transform: translate(var(--dx3), var(--dy3)) scale(0.2);
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .breath-ring-outer {
                width: 160px;
                height: 160px;
            }
            @keyframes breatheRing {
                0% {
                    width: 50px;
                    height: 50px;
                    opacity: 0.7;
                    border-color: rgba(255, 184, 160, 0.5);
                }
                50% {
                    width: 160px;
                    height: 160px;
                    opacity: 0;
                    border-color: rgba(91, 127, 191, 0.1);
                }
                100% {
                    width: 50px;
                    height: 50px;
                    opacity: 0.7;
                    border-color: rgba(255, 184, 160, 0.5);
                }
            }
            .moon {
                width: 60px;
                height: 60px;
                top: 5vh;
                right: 8vw;
            }
            .text-title {
                font-size: 1.3rem;
            }
            .text-hint {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>

    <div class="moon" id="moon"></div>
    <div class="fireflies" id="fireflies"></div>
    <div class="speed-toast" id="speed-toast"></div>

    <div class="main">
        <div class="breath-ring-outer" id="breath-zone">
            <div class="breath-ring"></div>
            <div class="breath-ring"></div>
            <div class="breath-ring"></div>
            <div class="breath-core" id="breath-core"></div>
        </div>
        <div class="text-group">
            <div class="text-title">深 呼 吸</div>
            <div class="text-hint" id="text-hint">跟随光晕 · 慢慢放松</div>
        </div>
    </div>

    <script>
        // =============================================
        //  全局粒子发射 API（供各处调用）
        // =============================================
        const ParticleSystem = (() => {
            const cvs = document.getElementById('particle-canvas');
            const ctx = cvs.getContext('2d');
            const list = [];
            let w, h;

            function resize() { w = cvs.width = innerWidth;
                h = cvs.height = innerHeight; }
            resize();
            window.addEventListener('resize', resize);

            /** 在 (x, y) 产生一团星尘粒子 */
            function burst(x, y, count = 38, hueMin = 20, hueMax = 50) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 110 + 35;
                    list.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: Math.random() * 1.6 + 0.7,
                        maxLife: 2.4,
                        r: Math.random() * 2.6 + 1,
                        hue: Math.random() * (hueMax - hueMin) + hueMin,
                    });
                }
            }

            /** 鼠标尾迹 */
            let mx = -200,
                my = -200;
            let trailAcc = 0;

            function spawnTrail(x, y) {
                list.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.5) * 18 - 12,
                    life: Math.random() * 0.7 + 0.35,
                    maxLife: 1.1,
                    r: Math.random() * 1.8 + 0.5,
                    hue: Math.random() * 20 + 25,
                });
            }

            document.addEventListener('mousemove', e => { mx = e.clientX;
                my = e.clientY; });
            document.addEventListener('touchmove', e => {
                mx = e.touches[0].clientX;
                my = e.touches[0].clientY;
            }, { passive: true });

            // 点击空白 → 爆发
            document.addEventListener('click', e => {
                if (e.target.closest('#breath-zone') || e.target.closest('.moon')) return;
                burst(e.clientX, e.clientY, 42);
            });
            document.addEventListener('touchstart', e => {
                if (e.target.closest('#breath-zone') || e.target.closest('.moon')) return;
                const t = e.touches[0];
                burst(t.clientX, t.clientY, 32);
            }, { passive: true });

            function tick(ts) {
                ctx.clearRect(0, 0, w, h);
                const dt = Math.min(ts - (tick._prev || ts), 50) / 1000;
                tick._prev = ts;

                // 尾迹
                if (mx > -100 && my > -100) {
                    trailAcc += dt;
                    while (trailAcc > 0.035) { trailAcc -= 0.035;
                        spawnTrail(mx, my); }
                }

                for (let i = list.length - 1; i >= 0; i--) {
                    const p = list[i];
                    p.life -= dt;
                    if (p.life <= 0) { list.splice(i, 1); continue; }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vx *= 0.965;
                    p.vy *= 0.965;
                    const t = 1 - p.life / p.maxLife;
                    const alpha = Math.sin(t * Math.PI) * 0.85;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * (1 - t * 0.4), 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, 90%, 76%, ${alpha.toFixed(3)})`;
                    ctx.fill();

                    if (alpha > 0.25) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${p.hue}, 80%, 72%, ${(alpha * 0.15).toFixed(3)})`;
                        ctx.fill();
                    }
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);

            return { burst };
        })();

        // =============================================
        //  星空
        // =============================================
        (() => {
            const cvs = document.getElementById('stars-canvas');
            const ctx = cvs.getContext('2d');
            const stars = [];
            const N = 200;
            let w, h;

            function resize() { w = cvs.width = innerWidth;
                h = cvs.height = innerHeight; }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < N; i++) {
                stars.push({
                    x: Math.random() * innerWidth,
                    y: Math.random() * innerHeight,
                    r: Math.random() * 1.6 + 0.4,
                    a: Math.random(),
                    sp: Math.random() * 0.012 + 0.003,
                    ph: Math.random() * Math.PI * 2,
                });
            }

            (function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) {
                    s.a += s.sp * (Math.sin(s.ph) > 0 ? 1 : -1) * 0.3;
                    s.a = Math.max(0.05, Math.min(1, s.a));
                    s.ph += 0.008;
                    if (s.ph > Math.PI * 2) s.ph -= Math.PI * 2;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,233,196,${s.a.toFixed(2)})`;
                    ctx.fill();

                    if (s.a > 0.7) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,233,196,${(s.a * 0.1).toFixed(3)})`;
                        ctx.fill();
                    }
                }
                requestAnimationFrame(draw);
            })();

            window.addEventListener('resize', () => {
                for (const s of stars) {
                    if (s.x > w) s.x = Math.random() * w;
                    if (s.y > h) s.y = Math.random() * h;
                }
            });
        })();

        // =============================================
        //  流萤
        // =============================================
        (() => {
            const box = document.getElementById('fireflies');
            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.className = 'firefly';
                el.style.cssText = `
                    --x: ${Math.random() * 85 + 5}%;
                    --y: ${Math.random() * 80 + 10}%;
                    --dx1: ${Math.random() * 60 - 30}px;
                    --dy1: ${Math.random() * -80 - 20}px;
                    --dx2: ${Math.random() * 80 - 40}px;
                    --dy2: ${Math.random() * -140 - 40}px;
                    --dx3: ${Math.random() * 40 - 20}px;
                    --dy3: ${Math.random() * -180 - 60}px;
                    --dur: ${Math.random() * 6 + 6}s;
                    --delay: ${Math.random() * 10}s;
                `;
                box.appendChild(el);
            }
        })();

        // =============================================
        //  月亮 → 涟漪 + 粒子
        // =============================================
        (() => {
            const moon = document.getElementById('moon');
            moon.addEventListener('click', e => {
                e.stopPropagation();
                const r = moon.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;

                // 涟漪
                for (let i = 0; i < 3; i++) {
                    const ripple = document.createElement('div');
                    ripple.className = 'moon-ripple';
                    ripple.style.left = cx + 'px';
                    ripple.style.top = cy + 'px';
                    ripple.style.animationDelay = (i * 0.28) + 's';
                    document.body.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 2500);
                }
                // 粒子爆发
                ParticleSystem.burst(cx, cy, 50);
            });
        })();

        // =============================================
        //  双击 → 孔明灯
        // =============================================
        (() => {
            document.addEventListener('dblclick', e => {
                if (e.target.closest('#breath-zone') || e.target.closest('.moon')) return;
                const lantern = document.createElement('div');
                lantern.className = 'lantern';
                lantern.style.cssText = `
                    --lx: ${e.clientX - 14}px;
                    --drift: ${Math.random() * 140 - 70}px;
                    --rot: ${Math.random() * 24 - 12}deg;
                    --rise-dur: ${Math.random() * 4 + 8}s;
                `;
                lantern.innerHTML =
                    '<div class="lantern-body"></div><div class="lantern-wick"></div><div class="lantern-tail"></div>';
                document.body.appendChild(lantern);
                setTimeout(() => lantern.remove(), 15000);
            });
        })();

        // =============================================
        //  点击呼吸圈 → 切换速度 + 粒子
        // =============================================
        (() => {
            const zone = document.getElementById('breath-zone');
            const toast = document.getElementById('speed-toast');
            const hint = document.getElementById('text-hint');
            const root = document.documentElement;

            const speeds = [
                { dur: 10, label: '🌙 慢速呼吸', hint: '深深吸气 · 缓缓呼出' },
                { dur: 7, label: '🌿 中速呼吸', hint: '跟随光晕 · 慢慢放松' },
                { dur: 5, label: '✨ 快速呼吸', hint: '轻快节奏 · 放松身心' },
            ];
            let idx = 0;
            let timer;

            function apply(i) {
                const { dur, label, hint: h } = speeds[i];
                root.style.setProperty('--breath-dur', dur + 's');
                // 同步更新 ring 的 animation-delay
                const rings = zone.querySelectorAll('.breath-ring');
                rings[0].style.animationDelay = '0s';
                rings[1].style.animationDelay = (dur / 3).toFixed(2) + 's';
                rings[2].style.animationDelay = (dur * 2 / 3).toFixed(2) + 's';
                hint.textContent = h;

                toast.textContent = label;
                toast.classList.add('show');
                clearTimeout(timer);
                timer = setTimeout(() => toast.classList.remove('show'), 1500);
            }

            zone.addEventListener('click', e => {
                e.stopPropagation();
                idx = (idx + 1) % speeds.length;
                apply(idx);

                const r = zone.getBoundingClientRect();
                ParticleSystem.burst(r.left + r.width / 2, r.top + r.height / 2, 30);
            });

            apply(0);
        })();
    </script>
</body>
</html>
